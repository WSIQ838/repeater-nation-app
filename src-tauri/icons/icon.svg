<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b1018"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(-12 30)">
  <!-- signal waves from the antenna tip -->
  <g fill="none" stroke="#f97316" stroke-linecap="round">
    <path d="M441 89 A80 80 0 0 1 441 191" stroke-width="34"/>
    <path d="M495 44 A150 150 0 0 1 495 236" stroke-width="34" opacity=".6"/>
    <path d="M319 89 A80 80 0 0 0 319 191" stroke-width="34"/>
    <path d="M265 44 A150 150 0 0 0 265 236" stroke-width="34" opacity=".6"/>
  </g>
  <!-- ground -->
  <rect x="200" y="880" width="660" height="56" rx="28" fill="#2b3648"/>
  <!-- tower -->
  <g fill="none" stroke="#e5e7eb" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M380 240 L280 890"/>
    <path d="M380 240 L480 890"/>
    <path d="M352 420 H408"/>
    <path d="M328 580 H432"/>
    <path d="M304 740 H456"/>
    <path d="M352 420 L432 580"/>
    <path d="M408 420 L328 580"/>
    <path d="M328 580 L456 740"/>
    <path d="M432 580 L304 740"/>
  </g>
  <rect x="352" y="140" width="56" height="130" rx="28" fill="#e5e7eb"/>
  <circle cx="380" cy="140" r="34" fill="#f97316"/>
  <!-- yagi antenna -->
  <g stroke="#9ca3af" stroke-linecap="round" fill="none" stroke-width="14">
    <path d="M395 330 H500"/>
    <path d="M430 304 V356"/>
    <path d="M462 310 V350"/>
    <path d="M494 316 V344"/>
  </g>
  <!-- feeder cable -->
  <path d="M432 640 H500" stroke="#9ca3af" stroke-width="14" stroke-linecap="round"/>
  <!-- roof antenna -->
  <rect x="740" y="410" width="24" height="100" rx="12" fill="#e5e7eb"/>
  <circle cx="752" cy="412" r="18" fill="#f97316"/>
  <!-- equipment shed -->
  <rect x="466" y="490" width="360" height="52" rx="22" fill="#c2410c"/>
  <rect x="486" y="526" width="320" height="364" rx="28" fill="url(#body)"/>
  <rect x="516" y="580" width="112" height="84" rx="16" fill="#0b1220"/>
  <rect x="534" y="600" width="60" height="18" rx="9" fill="#34d399"/>
  <rect x="534" y="630" width="76" height="14" rx="7" fill="#475569"/>
  <g fill="#7c2d12" opacity=".75">
    <rect x="516" y="704" width="112" height="14" rx="7"/>
    <rect x="516" y="738" width="112" height="14" rx="7"/>
    <rect x="516" y="772" width="112" height="14" rx="7"/>
    <rect x="516" y="806" width="112" height="14" rx="7"/>
  </g>
  <rect x="664" y="630" width="112" height="260" rx="16" fill="#9a3412"/>
  <rect x="744" y="740" width="14" height="46" rx="7" fill="#e5e7eb"/>
  </g>
</svg>
