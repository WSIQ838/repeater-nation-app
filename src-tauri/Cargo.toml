[package]
name = "repeater-nation-app"
version = "0.2.1"
description = "Repeater Nation phone and tablet app"
authors = ["Repeater Nation"]
edition = "2021"

[lib]
name = "repeater_nation_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-opener = "2.5"
tauri-plugin-deep-link = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
