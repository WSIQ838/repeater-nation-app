name: Build Repeater Nation for iPhone

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust for iOS
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Install dependencies
        run: |
          npm install
          command -v xcodegen >/dev/null || brew install xcodegen

      - name: Create the iPhone project
        run: |
          npx tauri ios init --ci
          npx tauri icon src-tauri/icons/icon.svg
          ls -la src-tauri/gen/apple

      # A simulator build needs no Apple account. It proves the app builds and gives
      # a screenshot of the app running on an iPhone.
      - name: Build for the iPhone simulator
        run: npx tauri ios build --target aarch64-sim --debug --ci

      - name: Screenshot in the iPhone simulator
        continue-on-error: true
        run: |
          APP=$(find src-tauri/gen/apple/build -name '*.app' -path '*simulator*' | head -1)
          [ -n "$APP" ] || APP=$(find src-tauri/gen/apple/build -name '*.app' | head -1)
          echo "App: $APP"
          DEVICE=$(xcrun simctl list devices available -j | node -e 'const d=JSON.parse(require("fs").readFileSync(0)).devices;for(const k of Object.keys(d).filter(k=>k.includes("iOS")).sort().reverse())for(const x of d[k])if(/^iPhone \d+( Pro)?$/.test(x.name)){console.log(x.udid);process.exit(0)}')
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl launch "$DEVICE" "$ID"
          sleep 25
          mkdir -p out
          xcrun simctl io "$DEVICE" screenshot out/iphone-simulator.png

      # Without an Apple developer account the phone build can't be signed. Build it
      # unsigned anyway so the moment an account is added only signing is left.
      - name: Build for iPhone (unsigned)
        continue-on-error: true
        run: |
          PBX=$(find src-tauri/gen/apple -name project.pbxproj | head -1)
          sed -i '' 's/buildSettings = {/buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = "";/' "$PBX"
          npx tauri ios build --target aarch64 --ci || true
          find src-tauri/gen/apple/build -maxdepth 4 | head -50
          APP=$(find src-tauri/gen/apple/build -name '*.app' -path '*iphoneos*' | head -1)
          [ -n "$APP" ] || APP=$(find src-tauri/gen/apple/build -name '*.xcarchive' -exec find {} -name '*.app' \; | head -1)
          echo "Device app: $APP"
          [ -n "$APP" ] || exit 1
          VERSION=$(node -p "require('./package.json').version")
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          mkdir -p out && zip -qr "out/Repeater-Nation-$VERSION-unsigned.ipa" Payload
          ls -la out

      - name: Upload the iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: repeater-nation-ios
          path: out/*
          if-no-files-found: warn

      - name: Add the iPhone app to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IPA=$(ls out/*.ipa 2>/dev/null | head -1)
          [ -n "$IPA" ] || { echo "No iPhone app was built"; exit 0; }
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          # The Android workflow may create this release at the same time; wait for it.
          for i in $(seq 1 20); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Repeater Nation v$VERSION" --notes-file .github/release-notes.md || \
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" out/* --clobber
